# ───── Server ─────
server.port=${PORT:8080}

# ───── MySQL Database ─────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/intellicare}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Micky@2006}

# ───── JPA / Hibernate ─────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ───── JWT ─────
app.jwt.secret=${APP_JWT_SECRET:IntelliCareSecretKey2026SuperSecureTokenSigningKeyMustBe256BitsLong!!}
app.jwt.expiration-ms=86400000

# ───── CORS ─────
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}